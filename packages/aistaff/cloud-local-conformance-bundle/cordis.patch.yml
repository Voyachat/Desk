# test_only deterministic Cloud local-read chain. Never include this bundle in production.
- insert:
    - id: aistaff-cloud-conformance
      name: '@deepseek-ai/dsh-aistaff-cloud-conformance'
      config:
        scenario: 'local_read'

    - id: aistaff-cloud-provider
      name: '@deepseek-ai/dsh-aistaff-cloud-provider'
      inject: [aistaffClientGatewayInputs]
      config:
        protocolOffer: '1.0-1.7'
        requestTimeoutMs: 5000
        pageLimit: 20
        selectionRenewalSkewMs: 30000
        reconnectDelayMs: 10

    - id: aistaff-cloud-local-conformance
      name: '@deepseek-ai/dsh-aistaff-cloud-local-conformance'
      inject: [aistaffCloudConformance]

    - id: aistaff-employee-experience-remote
      name: '@deepseek-ai/dsh-aistaff-employee-experience-remote'

    - id: aistaff-local-capability-remote
      name: '@deepseek-ai/dsh-aistaff-local-capability-remote'

    - id: aistaff-cloud-local-client-product
      name: '@deepseek-ai/dsh-aistaff-cloud-local-client-product'
