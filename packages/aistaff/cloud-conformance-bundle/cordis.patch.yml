# Test-only deterministic Cloud chain. Never include this bundle in a production profile.
- insert:
    - id: aistaff-cloud-conformance
      name: '@voyaseek-ai/dsh-aistaff-cloud-conformance'

    - id: aistaff-cloud-provider
      name: '@voyaseek-ai/dsh-aistaff-cloud-provider'
      inject: [aistaffClientGatewayInputs]
      config:
        protocolOffer: '1.0-1.7'
        requestTimeoutMs: 5000
        pageLimit: 20
        selectionRenewalSkewMs: 30000
        reconnectDelayMs: 10

    - id: aistaff-employee-experience-remote
      name: '@voyaseek-ai/dsh-aistaff-employee-experience-remote'

    - id: aistaff-cloud-client-product
      name: '@voyaseek-ai/dsh-aistaff-cloud-client-product'
