# Add both native product providers and the same independent foreground tool
# rows an Agent Preset may contribute. Loading the composition starts neither
# product; the scenario pins both model-visible schemas.
- id: base
  name: '@voyaseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - insert:
          - id: subagent-codex
            name: '@voyaseek-ai/dsh-subagent-codex'
          - id: subagent-claude-code
            name: '@voyaseek-ai/dsh-subagent-claude-code'
          - id: tool-subagent-codex
            name: '@voyaseek-ai/dsh-tool-subagent'
            config:
              provider: codex
              toolName: subagent_codex
              enableRunInBackground: false
              maxDepth: provider-managed
          - id: tool-subagent-claude-code
            name: '@voyaseek-ai/dsh-tool-subagent'
            config:
              provider: claude-code
              toolName: subagent_claude_code
              enableRunInBackground: false
              maxDepth: provider-managed
