# Keyless replay for automatic text-route image fallback. The replay catalog
# leaves flash text-only while a deterministic local converter prepares the
# real read_image tool result without a network call.
- id: base
  name: '@voyaseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@voyaseek-ai/dsh-llm-deepseek'
        disabled: true
      - id: acp-agent
        name: '@voyaseek-ai/dsh-acp-demo'
        config:
          provider: deepseek-official
          model: deepseek-v4-flash
          persistenceRoot: !!js process.env.DSH_SNAPSHOT_SESSIONS_ROOT ?? './.sessions'
          persistenceCompression: none
          workspaceContext:
            maxBytes: 65536
          persona: |
            You are a coding assistant powered by the {{model}} model. Your working directory is {{cwd}}. Your bash tool runs under a file sandbox — a `[sandbox: file access denied …]` result is policy, not a command bug.

            Verify your work by running the code or tests. Keep answers brief and factual.
      - insert:
          - id: attachment-local
            name: '@voyaseek-ai/dsh-attachment-local'
          - id: snapshot-document-converter
            name: './tests/fixtures/snapshot-document-converter.ts'
          - id: image-fallback
            name: '@voyaseek-ai/dsh-image-fallback'
            config:
              local: true
          - id: llm-replay
            name: '@voyaseek-ai/dsh-llm-replay'
            config:
              providers:
                - id: deepseek-official
                  name: DeepSeek
                  models:
                    - id: deepseek-v4-flash
                      inputModalities: [text]
                    - id: deepseek-v4-pro
                      inputModalities: [text]
