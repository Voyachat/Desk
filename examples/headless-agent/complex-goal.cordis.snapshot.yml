# Keyless replay composition for the shipped complex-goal task mode.
- id: base
  name: '@voyaseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - id: llm-deepseek
        name: '@voyaseek-ai/dsh-llm-deepseek'
        disabled: true
      - insert:
          - id: commands
            name: '@voyaseek-ai/dsh-commands'
          - id: goal
            name: '@voyaseek-ai/dsh-goal'
          - id: sandbox-policy
            name: '@voyaseek-ai/dsh-sandbox-policy'
            config:
              mode: workspace-write
              workspaceRoot: !!js process.cwd()
          - id: approval
            name: '@voyaseek-ai/dsh-user-approval'
          - id: complex-goal
            name: '@voyaseek-ai/dsh-complex-goal'
            config:
              automaticResume: false
              workspaceIsolation: off
          - id: llm-replay
            name: '@voyaseek-ai/dsh-llm-replay'
