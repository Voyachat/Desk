[package]
name = "aistaff-desktop-supervisor"
version = "0.1.0"
edition = "2024"
license = "UNLICENSED"
publish = false

[features]
supervisor-control-test-support = []

[dependencies]
aes-gcm = { version = "=0.11.0", default-features = false, features = ["aes", "alloc", "getrandom", "zeroize"] }
base64 = { version = "=0.23.0", default-features = false, features = ["std"] }
cap-std = "=4.0.2"
command-group = { version = "=5.0.1", default-features = false }
getrandom = "=0.4.3"
keyring-core = "=1.0.0"
libloading = "=0.9.0"
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
sha2 = "=0.11.0"
subtle = "2.6.1"
zeroize = "1.8.2"

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "=1.0.1", default-features = false, features = ["keychain"] }

[target.'cfg(target_os = "windows")'.dependencies]
cap-fs-ext = "=4.0.2"
windows-sys = { version = "=0.61.2", default-features = false, features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Cryptography",
  "Win32_Security_Isolation",
  "Win32_Storage_FileSystem",
  "Win32_System_JobObjects",
  "Win32_System_Memory",
  "Win32_System_Pipes",
  "Win32_System_Threading",
  "Win32_System_WindowsProgramming",
] }
windows-native-keyring-store = { version = "=1.1.0", default-features = false }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
